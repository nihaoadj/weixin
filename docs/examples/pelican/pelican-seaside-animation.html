        height: 100%;
      }
      body {
        background: #bde6e3;
        color: #204c50;
        font-family: Georgia, 'Times New Roman', serif;
      }
      main {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 480px;
        overflow: hidden;
      }
      .scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      header {
        position: absolute;
        top: 36px;
        left: 5%;
        pointer-events: none;
      }
      .eyebrow {
        font:
          11px/1.5 Arial,
          sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      h1 {
        font-size: 32px;
        font-weight: 400;
        margin: 8px 0;
        letter-spacing: 0;
      }
      footer {
        position: absolute;
        bottom: 26px;
        left: 5%;
        right: 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          11px/1.5 Arial,
          sans-serif;
      }
      button {
        border: 1px solid #204c5050;
        background: #ffffff66;
        color: #204c50;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 17px;
      }
      button:hover {
        background: #fff;
      }
      button:focus-visible {
        outline: 3px solid #d65747;
        outline-offset: 4px;
      }
      @media (max-width: 600px) {
        header {
          top: 25px;
        }
        h1 {
          font-size: 26px;
        }
        footer {
          bottom: 18px;
        }
      }
    </style>

    <script>
      const el = (id) => document.getElementById(id)
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
      let playing = !reducedMotion.matches
      let elapsed = 0
      let previous = null
      const roadMarks = []
      for (let i = 0; i < 12; i++) {
        const mark = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        el('road').appendChild(mark)
        roadMarks.push(mark)
      }
      function leg(hipX, hipY, footX, footY) {
        const dx = footX - hipX,
          dy = footY - hipY
        const distance = Math.hypot(dx, dy)
        const bend = Math.sqrt(Math.max(0, 106 * 106 - (distance * distance) / 4))
        return `M${hipX} ${hipY}L${(hipX + footX) / 2 - (dy / distance) * bend} ${(hipY + footY) / 2 + (dx / distance) * bend}L${footX} ${footY}`
      }
      function draw(time) {
        const angle = time * 3.6
        const degrees = (angle * 180) / Math.PI
        const bob = Math.sin(angle * 2) * 2
        el('rearWheel').setAttribute('transform', `rotate(${degrees * 1.5})`)
        el('frontWheel').setAttribute('transform', `rotate(${degrees * 1.5})`)
        el('birdBody').setAttribute('transform', `translate(0 ${bob})`)
        el('rider').setAttribute('transform', `translate(0 ${Math.sin(time * 7) * 0.8})`)
        el('scarfTail').setAttribute(
          'd',
          `M612 287Q573 ${281 + Math.sin(time * 8) * 6} 540 ${288 + Math.sin(time * 8 - 1) * 9}L523 ${273 + Math.sin(time * 8 - 1) * 9}Q565 ${261 + Math.sin(time * 8) * 6} 613 277Z`,
        )
        const x = 592 + Math.cos(angle) * 35,
          y = 610 + Math.sin(angle) * 35
        const fx = 1184 - x,
          fy = 1220 - y
        el('crankArms').setAttribute('d', `M${fx} ${fy}L${x} ${y}`)
        el('nearLeg').setAttribute('d', leg(546, 437 + bob, x, y - 9))
        el('farLeg').setAttribute('d', leg(563, 437 + bob, fx, fy - 9))
        ;[
          ['near', x, y],
          ['far', fx, fy],
        ].forEach(([side, px, py]) => {
          el(side + 'Foot').setAttribute('d', `M${px - 9} ${py - 7}h26`)
          el(side + 'Pedal').setAttribute('d', `M${px - 13} ${py + 1}h30`)
        })
        roadMarks.forEach((mark, index) => {
          const mx = ((((index * 137 - time * 160) % 1644) + 1644) % 1644) - 190
          const my = 744 + (index % 3) * 12
          mark.setAttribute('d', `M${mx} ${my}h${index % 2 ? 32 : 65}`)
        })
        el('clouds').setAttribute('transform', `translate(${(-time * 6) % 1400} 0)`)
        el('ripples').setAttribute('transform', `translate(${Math.sin(time * 0.4) * 22} 0)`)
        el('grass').setAttribute('transform', `translate(${(-time * 42) % 1250} 0)`)
      }
      function frame(now) {
        if (previous !== null && playing) elapsed += Math.min((now - previous) / 1000, 0.05)
        previous = now
        draw(elapsed)
        requestAnimationFrame(frame)
      }
      function updateButton() {
        el('toggle').textContent = playing ? 'Ⅱ' : '▶'
        el('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画')
        el('toggle').title = playing ? '暂停动画' : '播放动画'
      }
      el('toggle').addEventListener('click', () => {
        playing = !playing
        updateButton()
      })
      function resize() {
        el('scene').setAttribute('viewBox', innerWidth < 600 ? '260 60 670 850' : '0 0 1200 850')
      }
      addEventListener('resize', resize)
      resize()
      updateButton()
      requestAnimationFrame(frame)
    </script>
