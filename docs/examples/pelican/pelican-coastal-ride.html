<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#f6f2e8"
    />
    <title>鹈鹕的海岸骑行 · Pelican Cycling Club</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f2e8;
        --ink: #233e3c;
        --muted: #77847b;
        --orange: #dd6541;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .page {
        max-width: 1440px;
        margin: auto;
        padding: 32px 6vw 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 22px;
        border-bottom: 1px solid #233e3c25;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.13em;
      }
      .brand svg {
        width: 32px;
        height: 32px;
      }
      .edition {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.15em;
      }
      .intro {
        position: relative;
        padding-top: 44px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--orange);
        font-size: 11px;
        letter-spacing: 0.2em;
        font-weight: 650;
      }
      .eyebrow::before {
        content: '';
        width: 21px;
        height: 1px;
        background: currentColor;
      }
      h1 {
        margin: 13px 0 12px;
        font-size: clamp(34px, 5vw, 62px);
        letter-spacing: -0.04em;
        font-weight: 600;
        line-height: 1.15;
      }
      .intro p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.06em;
        line-height: 1.9;
      }
      .stamp {
        position: absolute;
        right: 6px;
        top: 52px;
        width: 83px;
        height: 83px;
        border: 1px solid #233e3c50;
        border-radius: 50%;
        display: grid;
        place-content: center;
        text-align: center;
        transform: rotate(12deg);
        font-size: 9px;
        letter-spacing: 0.17em;
        line-height: 1.9;
      }
      .stamp strong {
        font-family: Georgia, serif;
        font-size: 26px;
        line-height: 1.15;
        font-weight: normal;
      }
      .scene {
        margin: 4px -2vw 0;
        position: relative;
      }
      .scene > svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .dashboard {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 23px 0;
        border-top: 1px solid #233e3c25;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: #65746c;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #759b79;
        box-shadow: 0 0 0 4px #759b7915;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .speed {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
      }
      input[type='range'] {
        width: 105px;
        accent-color: var(--orange);
        cursor: pointer;
      }
      output {
        width: 32px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      button {
        min-height: 43px;
        border: 1px solid #233e3c40;
        border-radius: 50px;
        padding: 0 21px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        transition: background 0.2s;
      }
      button:hover {
        background: #233e3c0b;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 5px;
      }
      .button-icon {
        width: 10px;
        display: inline-block;
        font-size: 12px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        color: #899086;
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      @media (min-width: 1440px) {
        .page {
          padding-left: 85px;
          padding-right: 85px;
        }
      }
      @media (max-width: 600px) {
        .page {
          padding: 22px 6vw;
        }
        .edition {
          font-size: 9px;
          letter-spacing: 0.05em;
        }
        .brand {
          font-size: 9px;
          gap: 7px;
        }
        .brand svg {
          width: 26px;
        }
        .intro {
          padding-top: 35px;
        }
        .intro p {
          font-size: 12px;
          max-width: 240px;
        }
        .stamp {
          width: 60px;
          height: 60px;
          top: 110px;
          font-size: 7px;
        }
        .stamp strong {
          font-size: 19px;
        }
        .scene {
          margin: 27px -6vw 15px;
          overflow: hidden;
        }
        .scene > svg {
          width: 150%;
          max-width: none;
          margin-left: -25%;
        }
        .dashboard {
          flex-wrap: wrap;
          gap: 20px;
          padding: 20px 0;
        }
        .controls {
          width: 100%;
          justify-content: space-between;
          gap: 12px;
        }
        footer {
          font-size: 8px;
          letter-spacing: 0.05em;
        }
      }
    </style>
  </head>

            aria-label="暂停动画"
          >
            <span
              class="button-icon"
              id="button-icon"
              aria-hidden="true"
              >Ⅱ</span
            ><span id="button-label">歇一会儿</span>
          </button>
        </div>
      </div>
      <footer><span>一段没有目的地的小旅行。</span><span>DRAWN IN SVG · POWERED BY SEA BREEZE</span></footer>
    </main>
    <script>
      ;(() => {
        const el = (id) => document.getElementById(id)
        const parts = Object.fromEntries(
          [
            'rider',
            'rear-spokes',
            'front-spokes',
            'crank',
            'near-leg',
            'far-leg',
            'near-foot',
            'far-foot',
            'near-pedal',
            'far-pedal',
            'scarf',
            'eye',
            'water',
            'road-texture',
            'roadside',
            'clouds',
            'sailboat',
            'gulls',
            'breeze',
            'shadow',
          ].map((id) => [id, el(id)]),
        )
        const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)')
        let paused = motionPreference.matches
        let speed = 1
        let time = 0
        let previous = null
        let frame = null
        const attr = (id, name, value) => parts[id].setAttribute(name, value)

        function leg(side, angle) {
          const x = 592 + Math.cos(angle) * 29
          const y = 397 + Math.sin(angle) * 29
          const hipX = side === 'near' ? 565 : 552
          const hipY = side === 'near' ? 283 : 286
          // Two equal-length segments keep the knee connected to the rotating pedal.
          const dx = x - hipX,
            dy = y - 5 - hipY
          const distance = Math.hypot(dx, dy)
          const bend = Math.sqrt(Math.max(0, 82 * 82 - (distance * distance) / 4))
          const kneeX = (hipX + x) / 2 + (dy / distance) * bend
          const kneeY = (hipY + y - 5) / 2 - (dx / distance) * bend
          attr(side + '-leg', 'd', `M${hipX} ${hipY} Q${hipX + 8} ${hipY + 16} ${kneeX} ${kneeY} L${x} ${y - 5}`)
          attr(
            side + '-foot',
            'd',
            `M${x - 5} ${y - 10} Q${x + 3} ${y - 8} ${x + 10} ${y - 7} L${x + 24} ${y + 1} L${x + 10} ${y + 3} L${x + 3} ${y + 1} L${x - 8} ${y + 2}Z`,
          )
          attr(side + '-pedal', 'd', `M${x - 10} ${y + 5}h29`)
        }

        function render() {
          const phase = time * 3.8
          const angle = (phase * 180) / Math.PI
          attr('rider', 'transform', `translate(0 ${Math.sin(phase * 2) * 1.5})`)
          attr('rear-spokes', 'transform', `rotate(${angle * 1.6})`)
          attr('front-spokes', 'transform', `rotate(${angle * 1.6})`)
          attr('crank', 'transform', `rotate(${angle} 592 397)`)
          leg('near', phase)
          leg('far', phase + Math.PI)
          const flutter = Math.sin(time * 8) * 7
          attr(
            'scarf',
            'd',
            `M606 180Q566 ${161 + flutter} 537 ${174 + flutter}L514 ${167 + flutter} 523 ${187 + flutter}Q564 ${179 + flutter} 606 191Z`,
          )
          const blink = time % 5.3 > 5.12 ? 0.12 : 1
          attr('eye', 'transform', `translate(0 ${121 * (1 - blink)}) scale(1 ${blink})`)
          attr('road-texture', 'x', -((time * 125) % 180))
          attr('road-texture', 'width', 1380)
          attr('water', 'x', -((time * 17) % 240))
          attr('water', 'width', 1440)
          attr('roadside', 'transform', `translate(${-((time * 125) % 1400)} 0)`)
          attr('clouds', 'transform', `translate(${(-time * 3) % 1250} 0)`)
          attr('sailboat', 'transform', `translate(${1010 - ((time * 6) % 1250)} ${305 + Math.sin(time * 1.4) * 2})`)
          attr('gulls', 'transform', `translate(${Math.sin(time * 0.4) * 20} ${Math.sin(time * 1.7) * 4})`)
          attr('breeze', 'opacity', 0.45 + Math.sin(time * 3) * 0.25)
          attr('shadow', 'rx', 233 + Math.sin(phase * 2) * 3)
        }

        function tick(now) {
          frame = null
          if (paused || document.hidden) {
            previous = null
            return
          }
          if (previous !== null) time += Math.min((now - previous) / 1000, 0.05) * speed
          previous = now
          render()
          frame = requestAnimationFrame(tick)
        }
        function schedule() {
          if (!paused && !document.hidden && frame === null) frame = requestAnimationFrame(tick)
        }
        function updateControls() {
          el('button-icon').textContent = paused ? '▶' : 'Ⅱ'
          el('button-label').textContent = paused ? '继续兜风' : '歇一会儿'
          el('toggle').setAttribute('aria-label', paused ? '播放动画' : '暂停动画')
          el('status-text').textContent = paused ? '停下来，听听海风' : '正在悠闲兜风'
          el('status-dot').style.background = paused ? '#c49d64' : '#759b79'
        }
        el('toggle').addEventListener('click', () => {
          paused = !paused
          previous = null
          updateControls()
          schedule()
        })
        el('speed').addEventListener('input', (event) => {
          speed = Number(event.target.value)
          el('speed-value').value = speed.toFixed(1) + '×'
        })
        document.addEventListener('visibilitychange', () => {
          previous = null
          schedule()
        })
        motionPreference.addEventListener('change', (event) => {
          if (event.matches) {
            paused = true
            previous = null
            updateControls()
          }
        })
        render()
        updateControls()
        schedule()
      })()
    </script>
  </body>
</html>
