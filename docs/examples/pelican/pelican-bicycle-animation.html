<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="theme-color"
      content="#072f46"
    />
    <title>鹈鹕骑自行车 · SVG 2D 动画</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8f4f2;
        --muted: #9cc0c4;
        --panel: rgba(5, 25, 39, 0.76);
        --line: rgba(194, 235, 230, 0.18);
        --accent: #f6b04a;
        --accent-strong: #ff7b5e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow-x: hidden;
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: radial-gradient(circle at 50% -10%, #154d64 0, #092d45 44%, #061d2e 100%);
      }

      .artboard {
        width: min(1180px, 100%);
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #0a3046;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.35),
          0 8px 22px rgba(0, 0, 0, 0.2);
      }

      .artboard::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 12 / 7;
      }

      svg.paused * {
        animation-play-state: paused !important;
      }

      .toolbar {
        position: absolute;
        inset: 18px 18px auto 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
      }

      .title-lockup,
      .control {
        pointer-events: auto;
        border: 1px solid rgba(203, 240, 234, 0.2);
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 26px rgba(2, 14, 24, 0.2);
      }

      .title-lockup {
        padding: 10px 15px 11px;
        border-radius: 11px;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #f5fbf7;
        font-size: clamp(15px, 2vw, 21px);
        line-height: 1.2;
        letter-spacing: 0.01em;
      }

      .control {
        width: 42px;
        height: 42px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        border-radius: 50%;
        color: #fff5de;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease;
      }

      .control:hover {
        transform: translateY(-2px);
        border-color: rgba(246, 176, 74, 0.7);
        background: rgba(12, 48, 63, 0.88);
      }
      .control:focus-visible {
        outline: 3px solid rgba(246, 176, 74, 0.62);
        outline-offset: 3px;
      }
      .control svg {
        width: 18px;
        height: 18px;
        aspect-ratio: auto;
      }

      .play-icon {
        display: none;
      }
      svg.paused ~ .toolbar .pause-icon {
        display: none;
      }
      svg.paused ~ .toolbar .play-icon {
        display: block;
      }

      .caption {
        position: absolute;
        right: 19px;
        bottom: 17px;
        margin: 0;
        padding: 7px 10px;
        border: 1px solid rgba(203, 240, 234, 0.13);
        border-radius: 8px;
        color: rgba(232, 244, 242, 0.73);
        background: rgba(5, 25, 39, 0.45);
        font-size: 11px;
        letter-spacing: 0.04em;
        pointer-events: none;
      }

      @media (max-width: 560px) {
        body {
          padding: 10px;
        }
        .artboard {
          border-radius: 12px;
        }
        .toolbar {
          inset: 10px 10px auto 10px;
        }
        .title-lockup {
          padding: 8px 11px 9px;
        }
        .eyebrow {
          font-size: 9px;
        }
        .control {
          width: 36px;
          height: 36px;
        }
        .caption {
          right: 10px;
          bottom: 9px;
          font-size: 9px;
        }
      }

      /* SVG motion */
      .cloud {
        animation: cloudDrift 25s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cloud.slow {
        animation-duration: 36s;
        animation-delay: -10s;
      }
      .water-streak {
        animation: waterSlide 3.2s linear infinite;
      }
      .water-streak.alt {
        animation-delay: -1.7s;
        animation-duration: 4.5s;
      }
      .wave {
        animation: wavePulse 2.7s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .wave.alt {
        animation-delay: -1.1s;
        animation-duration: 3.6s;
      }
      .road-dash {
        animation: roadSlide 1.25s linear infinite;
      }
      .road-dash.alt {
        animation-delay: -0.62s;
      }
      .ride-group {
        animation: rideBob 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .wheel-spin {
        animation: wheelSpin 1.25s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .wing {
        animation: wingFlap 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 38% 70%;
      }
      .leg-a {
        animation: pedalA 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 594px 430px;
      }
      .leg-b {
        animation: pedalB 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 594px 430px;
      }
      .scarf-tail {
        animation: scarfFlutter 0.85s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 0 50%;
      }
      .feather {
        animation: featherLift 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .feather.two {
        animation-delay: -0.35s;
      }

      @keyframes cloudDrift {
        0% {
          transform: translateX(-40px);
        }
        50% {
          transform: translateX(30px);
        }
        100% {
          transform: translateX(-40px);
        }
      }
      @keyframes waterSlide {
        to {
          transform: translateX(-160px);
        }
      }
      @keyframes wavePulse {
        0%,
        100% {
          opacity: 0.4;
          transform: translateY(0);
        }
        50% {
          opacity: 0.82;
          transform: translateY(-3px);
        }
      }
      @keyframes roadSlide {
        to {
          transform: translateX(-240px);
        }
      }
      @keyframes rideBob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(7px);
        }
      }
      @keyframes wheelSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes wingFlap {
        0%,
        100% {
          transform: rotate(2deg) scaleY(1);
        }
        50% {
          transform: rotate(-7deg) scaleY(0.93);
        }
      }
      @keyframes pedalA {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pedalB {
        0% {
          transform: rotate(180deg);
        }
        50% {
          transform: rotate(360deg);
        }
        100% {
          transform: rotate(540deg);
        }
      }
      @keyframes scarfFlutter {
        0%,
        100% {
          transform: rotate(3deg) scaleX(1);
        }
        50% {
          transform: rotate(-8deg) scaleX(0.84);
        }
      }
      @keyframes featherLift {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-5deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

    <script>
      const scene = document.querySelector('#scene')
      const control = document.querySelector('.control')

      control.addEventListener('click', () => {
        const paused = scene.classList.toggle('paused')
        control.setAttribute('aria-label', paused ? '继续动画' : '暂停动画')
        control.setAttribute('title', paused ? '继续动画' : '暂停动画')
      })
