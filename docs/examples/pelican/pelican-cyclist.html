<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <title>鹈鹕的海岸骑行</title>
    <style>
      :root {
        color-scheme: light;
        background: #9dd9e6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #9dd9e6;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cloud-bank {
        animation: cloud-drift 24s linear infinite;
      }

      .far-shore {
        animation: shore-drift 18s linear infinite;
      }

      .wave-line {
        animation: wave-flow 4s linear infinite;
      }

      .road-marks {
        animation: road-flow 1.35s linear infinite;
      }

      .ride {
        animation: ride-bob 0.675s ease-in-out infinite alternate;
      }

      .rider {
        animation: rider-bob 0.675s ease-in-out infinite alternate;
      }

      .rear-wheel {
        transform-box: view-box;
        transform-origin: 494px 701px;
        animation: wheel-spin 1.35s linear infinite;
      }

      .front-wheel {
        transform-box: view-box;
        transform-origin: 866px 701px;
        animation: wheel-spin 1.35s linear infinite;
      }

      .crank {
        transform-box: view-box;
        transform-origin: 679px 690px;
        animation: wheel-spin 1.35s linear infinite;
      }

      .leg-front {
        transform-box: view-box;
        transform-origin: 650px 521px;
        animation: leg-front 1.35s ease-in-out infinite;
      }

      .leg-back {
        transform-box: view-box;
        transform-origin: 626px 523px;
        animation: leg-back 1.35s ease-in-out infinite;
      }

      .scarf-tail {
        transform-box: view-box;
        transform-origin: 622px 335px;
        animation: scarf-wave 0.85s ease-in-out infinite alternate;
      }

      .head-feather {
        transform-box: view-box;
        transform-origin: 682px 223px;
        animation: feather-wave 0.9s ease-in-out infinite alternate;
      }

      .eye-lid {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.6s ease-in-out infinite;
      }

      .shadow {
        transform-box: view-box;
        transform-origin: 680px 840px;
        animation: shadow-pulse 0.675s ease-in-out infinite alternate;
      }

      .speed-line {
        animation: speed-flicker 1.35s linear infinite;
      }

      .speed-line:nth-child(2) {
        animation-delay: -0.45s;
      }

      .speed-line:nth-child(3) {
        animation-delay: -0.9s;
      }

      @keyframes cloud-drift {
        to {
          transform: translateX(-720px);
        }
      }

      @keyframes shore-drift {
        to {
          transform: translateX(-480px);
        }
      }

      @keyframes wave-flow {
        to {
          stroke-dashoffset: -180;
        }
      }

      @keyframes road-flow {
        to {
          transform: translateX(-360px);
        }
      }

      @keyframes ride-bob {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(5px);
        }
      }

      @keyframes rider-bob {
        from {
          transform: translateY(0) rotate(-0.4deg);
        }
        to {
          transform: translateY(3px) rotate(0.4deg);
        }
      }

      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes leg-front {
        0%,
        100% {
          transform: rotate(12deg);
        }
        50% {
          transform: rotate(-24deg);
        }
      }

      @keyframes leg-back {
        0%,
        100% {
          transform: rotate(-23deg);
        }
        50% {
          transform: rotate(13deg);
        }
      }

      @keyframes scarf-wave {
        from {
          transform: rotate(3deg) scaleY(0.96);
        }
        to {
          transform: rotate(-7deg) scaleY(1.04);
        }
      }

      @keyframes feather-wave {
        from {
          transform: rotate(4deg);
        }
        to {
          transform: rotate(-8deg);
        }
      }

      @keyframes blink {
        0%,
        44%,
        48%,
        100% {
          transform: scaleY(0);
        }
        46% {
          transform: scaleY(1);
        }
      }

      @keyframes shadow-pulse {
        from {
          transform: scaleX(1);
          opacity: 0.22;
        }
        to {
          transform: scaleX(0.94);
          opacity: 0.16;
        }
      }

      @keyframes speed-flicker {
        0% {
          transform: translateX(90px);
          opacity: 0;
        }
        20% {
          opacity: 0.55;
        }
        80% {
          opacity: 0.55;
        }
        100% {
          transform: translateX(-90px);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-play-state: paused !important;
        }
      }
    </style>
  </head>
