<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>鹈鹕的海岸骑行</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #071728;
        font-family:
          system-ui,
          -apple-system,
          'Microsoft YaHei',
          sans-serif;
      }
      .frame {
        width: min(100vw, 1200px);
        aspect-ratio: 5 / 3;
        position: relative;
        overflow: hidden;
        background: #9ee4f2;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cloud {
        animation: drift 18s linear infinite;
      }
      .cloud.slow {
        animation-duration: 26s;
        animation-direction: reverse;
      }
      .gulls {
        animation: gulls 8s ease-in-out infinite;
      }
      .wave {
        animation: swell 3.2s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .wave.two {
        animation-delay: -1.5s;
      }
      .road-lines {
        animation: road 1.25s linear infinite;
      }
      .bike-rider {
        animation: ride 0.7s ease-in-out infinite alternate;
        transform-origin: 610px 500px;
      }
      .wheel {
        animation: wheel-spin 1s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .crank {
        animation: wheel-spin 1s linear infinite;
        transform-origin: 610px 515px;
      }
      .rear-leg {
        animation: pedal-rear 1s ease-in-out infinite;
      }
      .front-leg {
        animation: pedal-front 1s ease-in-out infinite;
      }
      .wing {
        animation: wing 1.4s ease-in-out infinite alternate;
        transform-origin: 620px 350px;
      }
      .bill {
        animation: bill 2.8s ease-in-out infinite;
        transform-origin: 720px 255px;
      }
      .spark {
        animation: twinkle 1.6s ease-in-out infinite alternate;
      }
      .spark.delay {
        animation-delay: -0.75s;
      }
      .title {
        letter-spacing: 0.18em;
      }
      @keyframes drift {
        from {
          transform: translateX(-145px);
        }
        to {
          transform: translateX(1260px);
        }
      }
      @keyframes gulls {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(30px, -12px);
        }
      }
      @keyframes swell {
        to {
          transform: translateX(-22px) translateY(4px);
        }
      }
      @keyframes road {
        to {
          transform: translateX(-84px);
        }
      }
      @keyframes ride {
        to {
          transform: translateY(-5px) rotate(0.25deg);
        }
      }
      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pedal-rear {
        0%,
        100% {
          d: path('M 558 405 Q 577 448 596 477 Q 611 500 632 516');
        }
        50% {
          d: path('M 558 405 Q 586 431 624 457 Q 648 474 665 495');
        }
      }
      @keyframes pedal-front {
        0%,
        100% {
          d: path('M 579 406 Q 596 444 624 470 Q 646 493 665 495');
        }
        50% {
          d: path('M 579 406 Q 598 450 604 481 Q 608 503 632 516');
        }
      }
      @keyframes wing {
        to {
          transform: rotate(-6deg) translateY(-3px);
        }
      }
      @keyframes bill {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(2deg) translateY(2px);
        }
      }
      @keyframes twinkle {
        to {
          opacity: 0.25;
          transform: scale(0.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
