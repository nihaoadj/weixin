<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>鹈鹕骑自行车 · SVG 2D 动画</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --muted: #607080;
        --paper: #f5f0e8;
        --panel: #fffdf9;
        --teal: #0f7182;
        --teal-dark: #075263;
        --coral: #ee745f;
        --yellow: #f5c85c;
        --sky: #bfe7ed;
        --ground: #dbe7d4;
        --road: #53616a;
        --cycle: 8s;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        background: #e8eef0;
      }

      .scene {
        width: min(1080px, 100%);
        overflow: hidden;
        border: 1px solid rgba(23, 33, 43, 0.12);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 20px 55px rgba(27, 48, 56, 0.16);
      }

      .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        padding: 25px 30px 19px;
        border-bottom: 1px solid rgba(23, 33, 43, 0.1);
        background: linear-gradient(112deg, #fffdf9 0%, #faf4ea 100%);
      }

      h1 {
        margin: 0;
        font-size: clamp(23px, 3vw, 34px);
        letter-spacing: 0.01em;
      }
      .subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .badge {
        flex: 0 0 auto;
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--teal-dark);
        background: #dff2f2;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .art {
        position: relative;
        aspect-ratio: 16 / 8.4;
        min-height: 320px;
        background: var(--sky);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .cloud {
        animation: drift 22s linear infinite;
      }
      .cloud.slow {
        animation-duration: 31s;
        animation-delay: -11s;
      }
      .sun {
        transform-origin: 88% 17%;
        animation: sunPulse 5s ease-in-out infinite;
      }
      .bird {
        animation: birdBob var(--cycle) ease-in-out infinite;
        transform-origin: 50% 62%;
      }
      .wing {
        animation: wingFlap 1.7s ease-in-out infinite;
        transform-origin: 54% 45%;
      }
      .wheel {
        animation: wheelSpin var(--cycle) linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .pedal-arm {
        animation: pedalSpin var(--cycle) linear infinite;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .leg-back {
        animation: legBack var(--cycle) linear infinite;
        transform-box: fill-box;
        transform-origin: 0% 0%;
      }
      .leg-front {
        animation: legFront var(--cycle) linear infinite;
        transform-box: fill-box;
        transform-origin: 0% 0%;
      }
      .road-dash {
        animation: roadMove 1.1s linear infinite;
      }

      .is-paused * {
        animation-play-state: paused !important;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 17px 24px 21px;
        background: var(--paper);
      }

      .caption {
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: end;
      }
      button {
        border: 1px solid rgba(23, 33, 43, 0.18);
        border-radius: 9px;
        padding: 9px 13px;
        color: var(--ink);
        background: #fffdf9;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: var(--teal);
      }
      button:focus-visible {
        outline: 3px solid rgba(15, 113, 130, 0.3);
        outline-offset: 2px;
      }
      button.primary {
        color: white;
        border-color: var(--teal);
        background: var(--teal);
      }
      button.primary:hover {
        background: var(--teal-dark);
      }

      @keyframes drift {
        from {
          transform: translateX(-22%);
        }
        to {
          transform: translateX(22%);
        }
      }
      @keyframes sunPulse {
        0%,
        100% {
          opacity: 0.78;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      @keyframes birdBob {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-7px) rotate(1deg);
        }
      }
      @keyframes wingFlap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-8deg);
        }
      }
      @keyframes wheelSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pedalSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes legBack {
        0% {
          transform: rotate(14deg);
        }
        25% {
          transform: rotate(64deg);
        }
        50% {
          transform: rotate(14deg);
        }
        75% {
          transform: rotate(-42deg);
        }
        100% {
          transform: rotate(14deg);
        }
      }
      @keyframes legFront {
        0% {
          transform: rotate(-42deg);
        }
        25% {
          transform: rotate(14deg);
        }
        50% {
          transform: rotate(64deg);
        }
        75% {
          transform: rotate(14deg);
        }
        100% {
          transform: rotate(-42deg);
        }
      }
      @keyframes roadMove {
        to {
          transform: translateX(-100px);
        }
      }

      @media (max-width: 650px) {
        body {
          padding: 0;
        }
        .scene {
          border: 0;
          border-radius: 0;
          min-height: 100vh;
        }
        .header {
          padding: 22px 20px 17px;
          align-items: start;
        }
        .badge {
          display: none;
        }
        .art {
          min-height: 280px;
          aspect-ratio: 1 / 1;
        }
        .controls {
          align-items: start;
          flex-direction: column;
          padding: 15px 20px 20px;
        }
        .actions {
          width: 100%;
          justify-content: start;
        }
        button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>

      <footer class="controls">
        <span
          class="caption"
          id="status"
          aria-live="polite"
          >海风正好，出发！</span
        >
        <div class="actions">
          <button
            class="primary"
            id="toggle"
            type="button"
          >
            暂停动画
          </button>
          <button
            id="speed"
            type="button"
          >
            加速骑行
          </button>
          <button
            id="replay"
            type="button"
          >
            重新出发
          </button>
        </div>
      </footer>
    </main>

    <script>
      const art = document.querySelector('.art')
      const toggle = document.querySelector('#toggle')
      const speed = document.querySelector('#speed')
      const replay = document.querySelector('#replay')
      const status = document.querySelector('#status')
      let paused = false
      let fast = false

      toggle.addEventListener('click', () => {
        paused = !paused
        art.classList.toggle('is-paused', paused)
        toggle.textContent = paused ? '继续动画' : '暂停动画'
        status.textContent = paused ? '动画已停在这一帧' : fast ? '风驰电掣，继续前进！' : '海风正好，出发！'
      })

      speed.addEventListener('click', () => {
        fast = !fast
        document.documentElement.style.setProperty('--cycle', fast ? '4.8s' : '8s')
        speed.textContent = fast ? '恢复慢速' : '加速骑行'
        if (!paused) status.textContent = fast ? '风驰电掣，继续前进！' : '海风正好，出发！'
      })

      replay.addEventListener('click', () => {
        art.classList.remove('is-paused')
        paused = false
        toggle.textContent = '暂停动画'
        status.textContent = fast ? '风驰电掣，继续前进！' : '海风正好，出发！'
        document.querySelectorAll('.wheel, .pedal-arm, .leg-back, .leg-front, .bird').forEach((node) => {
          node.style.animation = 'none'
          void node.offsetWidth
          node.style.animation = ''
        })
      })
    </script>
