<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>鹈鹕骑自行车 · SVG 2D 动画</title>
    <style>
      :root {
        --night: #112f45;
        --sea: #2b7d83;
        --foam: #d9f0dc;
        --sand: #f4c878;
        --coral: #ed7658;
        --ink: #183042;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
        color: var(--ink);
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #f6f0df;
      }

      .stage {
        position: relative;
        width: min(1100px, 100%);
        overflow: hidden;
        border: 1px solid rgba(24, 48, 66, 0.16);
        border-radius: 14px;
        background: var(--night);
        box-shadow: 0 22px 60px rgba(18, 42, 55, 0.24);
      }

      #scene {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 11 / 7;
      }
      #scene.paused *,
      #scene.paused {
        animation-play-state: paused !important;
      }

      .label {
        position: absolute;
        left: 18px;
        top: 16px;
        padding: 9px 12px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        color: #fff8e9;
        background: rgba(17, 47, 69, 0.58);
        backdrop-filter: blur(8px);
      }
      .label small {
        display: block;
        margin-bottom: 2px;
        color: var(--sand);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .label strong {
        font-size: clamp(14px, 2.1vw, 20px);
      }

      .toggle {
        position: absolute;
        top: 17px;
        right: 18px;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 50%;
        color: #fff9ec;
        background: rgba(17, 47, 69, 0.58);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }
      .toggle:hover {
        transform: translateY(-2px);
        background: rgba(17, 47, 69, 0.85);
      }
      .toggle:focus-visible {
        outline: 3px solid rgba(244, 200, 120, 0.8);
        outline-offset: 2px;
      }
      .toggle svg {
        width: 17px;
        height: 17px;
        vertical-align: middle;
      }
      .toggle .play {
        display: none;
      }
      #scene.paused ~ .toggle .pause {
        display: none;
      }
      #scene.paused ~ .toggle .play {
        display: inline;
      }

      .cloud {
        animation: drift 24s ease-in-out infinite;
      }
      .cloud.late {
        animation-delay: -9s;
        animation-duration: 32s;
      }
      .dash {
        animation: road 1.25s linear infinite;
      }
      .dash.late {
        animation-delay: -0.62s;
      }
      .water {
        animation: water 4s linear infinite;
      }
      .water.late {
        animation-delay: -2s;
        animation-duration: 5.6s;
      }
      .cycle {
        animation: bounce 1.08s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .wheel {
        animation: spin 1.1s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .wing {
        animation: flap 1.08s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 38% 70%;
      }
      .tail {
        animation: flap 1.08s ease-in-out infinite -0.34s;
        transform-box: fill-box;
        transform-origin: 100% 60%;
      }
      .scarf {
        animation: flutter 0.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 0 50%;
      }
      .leg.front {
        animation: pedal-front 1.08s linear infinite;
        transform-box: fill-box;
        transform-origin: 570px 416px;
      }
      .leg.back {
        animation: pedal-back 1.08s linear infinite;
        transform-box: fill-box;
        transform-origin: 570px 416px;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translateX(-26px);
        }
        50% {
          transform: translateX(34px);
        }
      }
      @keyframes road {
        to {
          transform: translateX(-210px);
        }
      }
      @keyframes water {
        to {
          transform: translateX(-170px);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(6px);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes flap {
        0%,
        100% {
          transform: rotate(2deg) scaleY(1);
        }
        50% {
          transform: rotate(-7deg) scaleY(0.92);
        }
      }
      @keyframes flutter {
        0%,
        100% {
          transform: rotate(3deg) scaleX(1);
        }
        50% {
          transform: rotate(-11deg) scaleX(0.78);
        }
      }
      @keyframes pedal-front {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pedal-back {
        from {
          transform: rotate(180deg);
        }
        to {
          transform: rotate(540deg);
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 8px;
        }
        .stage {
          border-radius: 10px;
        }
        .label {
          left: 10px;
          top: 10px;
          padding: 7px 9px;
        }
        .label small {
          font-size: 8px;
        }
        .toggle {
          top: 10px;
          right: 10px;
          width: 34px;
          height: 34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

    <script>
      const scene = document.querySelector('#scene')
      const toggle = document.querySelector('.toggle')
      toggle.addEventListener('click', () => {
        const paused = scene.classList.toggle('paused')
        toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画')
        toggle.setAttribute('title', paused ? '继续动画' : '暂停动画')
      })
