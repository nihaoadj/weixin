name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'codex/**'
  pull_request:

jobs:
  contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install --require-hashes -r backend/requirements-dev.txt

      - name: Verify generated contract
        run: npm run contract:check

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:coverage

      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm run audit:all

  backend:
    name: FastAPI backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing -q
